<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"><title>Register Account</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <a href="index.html" class="logo">🚀 StartupShop</a>
        <nav><ul>
            <li><a href="index.html">Home</a></li><li><a href="about.html">About</a></li><li><a href="products.html">Products</a></li><li><a href="product-detail.html">Details</a></li><li><a href="register.html">Register</a></li><li><a href="login.html">Login</a></li><li><a href="contact.html">Contact</a></li><li><a href="checkout.html">Checkout</a></li>
        </ul></nav>
    </header>
    <main class="container">
        <form action="#" method="POST">
            <h2>Create Account</h2><br>
            <div class="form-group"><label>Full Name</label><input type="text" required></div>
            <div class="form-group"><label>Birthday</label><input type="date" required></div>
            <div class="form-group"><label>Gender</label><select><option>Male</option><option>Female</option><option>Other</option></select></div>
            <div class="form-group"><label>Address</label><input type="text" required></div>
            <div class="form-group"><label>Email</label><input type="email" required></div>
            <div class="form-group"><label>Phone Number</label><input type="tel" required></div>
            <div class="form-group"><label>Username</label><input type="text" required></div>
            <div class="form-group"><label>Password</label><input type="password" required></div>
            <div class="form-group"><label>Confirm Password</label><input type="password" required></div>
            <button type="submit" class="btn">Submit</button>
            <button type="reset" class="btn" style="background:#555;">Reset</button>
        </form>
    </main>
    <footer><p>&copy; 2026 Startup Business.</p></footer>
</body>
</html>
