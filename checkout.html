<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"><title>Checkout</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <a href="index.html" class="logo">🚀 StartupShop</a>
        <nav><ul>
            <li><a href="index.html">Home</a></li><li><a href="about.html">About</a></li><li><a href="products.html">Products</a></li><li><a href="product-detail.html">Details</a></li><li><a href="register.html">Register</a></li><li><a href="login.html">Login</a></li><li><a href="contact.html">Contact</a></li><li><a href="checkout.html">Checkout</a></li>
        </ul></nav>
    </header>
    <main class="container">
        <h2>Checkout System</h2><br>
        <div class="grid-layout">
            <form action="#">
                <h3>Customer & Order Details</h3><br>
                <div class="form-group"><label>Full Name</label><input type="text" required></div>
                <div class="form-group"><label>Email</label><input type="email" required></div>
                <div class="form-group"><label>Address</label><input type="text" required></div>
                <div class="form-group"><label>Phone Number</label><input type="tel" required></div>
                <div class="form-group"><label>Product Selection</label><input type="text" value="Premium Startup Gadget" readonly></div>
                <div class="form-group"><label>Quantity</label><input type="number" value="1" min="1"></div>
                <div class="form-group"><label>Shipping Method</label><select><option>Standard Express</option><option>Next-Day Delivery</option></select></div>
                <div class="form-group"><label>Payment Method</label><select><option>Cash on Delivery</option><option>Credit Card (Design Only)</option></select></div>
            </form>
            <div class="product-card" style="text-align:left;">
                <h3>Order Summary</h3><br>
                <p>Product: Premium Startup Gadget</p>
                <p>Quantity: 1</p>
                <p>Price: ₱4,999.00</p>
                <hr style="margin:15px 0;"><h3 style="color:var(--accent);">Total: ₱4,999.00</h3><br><br>
                <button class="btn" onclick="alert('Order Placed Successfully!')">Place Order</button>
                <button class="btn" style="background:#555;" onclick="window.location.href='products.html'">Cancel</button>
            </div>
        </div>
    </main>
    <footer><p>&copy; 2026 Startup Business.</p></footer>
</body>
</html>
